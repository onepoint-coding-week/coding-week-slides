<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Week 2026 · Thursday</title>
  <link rel="stylesheet" href="vendor/reveal.js/reset.css">
  <link rel="stylesheet" href="vendor/reveal.js/reveal.css">
  <link rel="stylesheet" href="vendor/reveal.js/theme/black.css">
  <link rel="stylesheet" href="theme/coding-week.css">
</head>
<body>
<div class="reveal">
<div class="slides">

<section>
  <div class="r-hstack">
    <img class="stickers" src="assets/stickers.webp" alt="">
    <div style="text-align: left;">
      <h1>Your last day of code</h1>
    </div>
  </div>
</section>

<section>
  <h2>Today</h2>
  <p>Last coding session from <b>now to 12:30</b></p>
  <p class="lead"><b>After 15:00, PRs will not be accepted anymore.</b></p>
  <br >
  <p>This afternoon, you will start working on your <b>pitch</b></p>
</section>

<section>
  <div class="r-hstack">
    <img class="stickers" src="assets/stickers.webp" alt="">
    <div>
      <h2>Code time !</h2>
    </div>
  </div>
</section>

</div>

<footer class="partners" aria-label="Partners">
  <img class="onepoint" src="assets/logos/onepoint.svg" alt="onepoint">
  <span aria-hidden="true">×</span>
  <img class="centrale" src="assets/logos/centralesupelec.svg" alt="CentraleSupélec">
  <span aria-hidden="true">×</span>
  <img class="aws" src="assets/logos/aws.png" alt="powered by AWS">
</footer>
</div>
<script src="vendor/reveal.js/reveal.js"></script>
<script src="vendor/reveal.js/plugin/notes.js"></script>
<script>
  // À l'export PDF, une page fixe de 1280×720 ; à l'écran, le deck occupe toute la fenêtre.
  const printing = /print-pdf/.test(window.location.search);
  Reveal.initialize({
    width: printing ? 1280 : "100%",
    height: printing ? 720 : "100%",
    hash: true,
    controls: false,
    plugins: [RevealNotes],
  });
</script>
</body>
</html>
